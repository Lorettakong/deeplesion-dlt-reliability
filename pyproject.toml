[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deeplesion-dlt-reliability"
version = "0.1.0"
description = "Reliability evaluation code for sparse longitudinal CT lesion prediction using DeepLesion-DLT."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "torch>=2.0",
]

[tool.setuptools.packages.find]
include = ["nlstt_adaptive_uq_experiments*"]
